---
services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_postgres
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 128
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agency_admin} -d ${POSTGRES_DB:-agency_dw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agency_internal_net

volumes:
  pgdata:

networks:
  agency_internal_net:
    external: true
